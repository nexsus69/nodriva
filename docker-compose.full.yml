name: nodriva

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    command: ["postgres", "-p", "${DASHBOARD_POSTGRES_PORT:?DASHBOARD_POSTGRES_PORT must be set}"]
    environment:
      POSTGRES_DB: dashboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - nodriva_db_data:/var/lib/postgresql/data
      - ./Specifiche/dashboard_v4_schema_corrected.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p ${DASHBOARD_POSTGRES_PORT:?DASHBOARD_POSTGRES_PORT must be set} -U postgres -d dashboard"]
      interval: 5s
      timeout: 5s
      retries: 20

  db-migrate:
    build:
      context: .
      dockerfile: docker/db-migrate/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: ${DASHBOARD_POSTGRES_HOST:?DASHBOARD_POSTGRES_HOST must be set}
      PGPORT: ${DASHBOARD_POSTGRES_PORT:?DASHBOARD_POSTGRES_PORT must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      DASHBOARD_WEB_PASSWORD: ${DASHBOARD_WEB_PASSWORD:?DASHBOARD_WEB_PASSWORD must be set}
    volumes:
      - ./db/migrations:/schema/migrations:ro
    restart: "no"

  db-seed:
    build:
      context: .
      dockerfile: docker/db-seed/Dockerfile
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: ${DASHBOARD_POSTGRES_HOST:?DASHBOARD_POSTGRES_HOST must be set}
      POSTGRES_PORT: ${DASHBOARD_POSTGRES_PORT:?DASHBOARD_POSTGRES_PORT must be set}
      POSTGRES_DB: dashboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-marco123@test.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD must be set}
    restart: "no"

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      args:
        NEXT_PUBLIC_REALTIME_ENABLED: ${NEXT_PUBLIC_REALTIME_ENABLED:-false}
        NEXT_PUBLIC_DEBUG_OVERLAYS: ${NEXT_PUBLIC_DEBUG_OVERLAYS:-false}
        NEXT_PUBLIC_CACHE_DEBUG: ${NEXT_PUBLIC_CACHE_DEBUG:-false}
        NEXT_PUBLIC_PUSHER_KEY: ${NEXT_PUBLIC_PUSHER_KEY:-}
        NEXT_PUBLIC_PUSHER_CLUSTER: ${NEXT_PUBLIC_PUSHER_CLUSTER:-}
        NEXT_PUBLIC_PUSHER_HOST: ${NEXT_PUBLIC_PUSHER_HOST:-}
        NEXT_PUBLIC_PUSHER_PORT: ${NEXT_PUBLIC_PUSHER_PORT:-}
        NEXT_PUBLIC_PUSHER_SCHEME: ${NEXT_PUBLIC_PUSHER_SCHEME:-}
        NEXT_PUBLIC_SESSION_IDLE_TIMEOUT_SECONDS: ${NEXT_PUBLIC_SESSION_IDLE_TIMEOUT_SECONDS:-1800}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      db-seed:
        condition: service_completed_successfully
    environment:
      HOSTNAME: ${DASHBOARD_WEB_BIND_ADDRESS:?DASHBOARD_WEB_BIND_ADDRESS must be set}
      DASHBOARD_WEB_PORT: ${DASHBOARD_WEB_PORT:?DASHBOARD_WEB_PORT must be set}
      PORT: ${DASHBOARD_WEB_PORT:?DASHBOARD_WEB_PORT must be set}
      DATABASE_ADAPTER: postgres
      DASHBOARD_WEB_PASSWORD: ${DASHBOARD_WEB_PASSWORD:?DASHBOARD_WEB_PASSWORD must be set}
      DASHBOARD_POSTGRES_HOST: ${DASHBOARD_POSTGRES_HOST:?DASHBOARD_POSTGRES_HOST must be set}
      DASHBOARD_POSTGRES_PORT: ${DASHBOARD_POSTGRES_PORT:?DASHBOARD_POSTGRES_PORT must be set}
      REQUIRE_RESTRICTED_DB_ROLE: "true"
      NEXTAUTH_URL: ${DASHBOARD_PUBLIC_URL:?DASHBOARD_PUBLIC_URL must be set}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET must be set}
      NEXT_PUBLIC_SESSION_IDLE_TIMEOUT_SECONDS: ${NEXT_PUBLIC_SESSION_IDLE_TIMEOUT_SECONDS:-1800}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-marco123@test.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD must be set}
      # Application integration settings are intentionally independent from the
      # Compose topology below.  A deployment may use remote providers, or no
      # provider at all; never infer an application endpoint from a local
      # container name.
      NEXT_PUBLIC_REALTIME_ENABLED: ${NEXT_PUBLIC_REALTIME_ENABLED:-false}
      NEXT_PUBLIC_DEBUG_OVERLAYS: ${NEXT_PUBLIC_DEBUG_OVERLAYS:-false}
      NEXT_PUBLIC_CACHE_DEBUG: ${NEXT_PUBLIC_CACHE_DEBUG:-false}
      REALTIME_WORKER_SECRET: ${REALTIME_WORKER_SECRET:-}
      NEXT_PUBLIC_PUSHER_KEY: ${NEXT_PUBLIC_PUSHER_KEY:-}
      NEXT_PUBLIC_PUSHER_CLUSTER: ${NEXT_PUBLIC_PUSHER_CLUSTER:-}
      NEXT_PUBLIC_PUSHER_HOST: ${NEXT_PUBLIC_PUSHER_HOST:-}
      NEXT_PUBLIC_PUSHER_PORT: ${NEXT_PUBLIC_PUSHER_PORT:-}
      NEXT_PUBLIC_PUSHER_SCHEME: ${NEXT_PUBLIC_PUSHER_SCHEME:-}
      REALTIME_INTERNAL_HOST: ${REALTIME_INTERNAL_HOST:-}
      REALTIME_INTERNAL_PORT: ${REALTIME_INTERNAL_PORT:-}
      REALTIME_INTERNAL_SCHEME: ${REALTIME_INTERNAL_SCHEME:-}
      PUSHER_APP_ID: ${PUSHER_APP_ID:-dashboard}
      PUSHER_SECRET: ${PUSHER_SECRET:-}
      CLAMAV_HOST: ${CLAMAV_HOST:-}
      CLAMAV_PORT: ${CLAMAV_PORT:-}
      ATTACHMENTS_REQUIRE_SCAN: ${ATTACHMENTS_REQUIRE_SCAN:-false}
      ATTACHMENTS_ROOT: /app/data/attachments
      ATTACHMENTS_REQUIRE_ENCRYPTION: "true"
      ATTACHMENTS_ENCRYPTION_KEY: ${ATTACHMENTS_ENCRYPTION_KEY:?ATTACHMENTS_ENCRYPTION_KEY must be set}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?FIELD_ENCRYPTION_KEY must be set}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?MFA_ENCRYPTION_KEY must be set}
      ACCOUNT_ACTION_PUBLIC_BASE_URL: ${DASHBOARD_PUBLIC_URL:?DASHBOARD_PUBLIC_URL must be set}
      BACKUP_ROOT: ${BACKUP_ROOT:-}
      BACKUP_STATUS_FILE: ${BACKUP_STATUS_FILE:-}
    volumes:
      - nodriva_attachments:/app/data/attachments
      - nodriva_backups:/backups:ro
    expose:
      - "${DASHBOARD_WEB_PORT:?DASHBOARD_WEB_PORT must be set}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch(`http://${CONTAINER_LOOPBACK_HOST:?CONTAINER_LOOPBACK_HOST must be set}:$${process.env.DASHBOARD_WEB_PORT}/login`).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  proxy:
    image: caddy:2.9-alpine
    depends_on:
      web:
        condition: service_healthy
    environment:
      DASHBOARD_PUBLIC_HOST: ${DASHBOARD_PUBLIC_HOST:?DASHBOARD_PUBLIC_HOST must be set}
      DASHBOARD_HTTP_PORT: ${DASHBOARD_HTTP_PORT:?DASHBOARD_HTTP_PORT must be set}
      DASHBOARD_HTTPS_PORT: ${DASHBOARD_HTTPS_PORT:?DASHBOARD_HTTPS_PORT must be set}
      DASHBOARD_WEB_PORT: ${DASHBOARD_WEB_PORT:?DASHBOARD_WEB_PORT must be set}
      DASHBOARD_WEB_INTERNAL_HOST: ${DASHBOARD_WEB_INTERNAL_HOST:?DASHBOARD_WEB_INTERNAL_HOST must be set}
    ports:
      - "${DASHBOARD_BIND_ADDRESS:?DASHBOARD_BIND_ADDRESS must be set}:${DASHBOARD_HTTP_PORT:?DASHBOARD_HTTP_PORT must be set}:${DASHBOARD_HTTP_PORT:?DASHBOARD_HTTP_PORT must be set}"
      - "${DASHBOARD_BIND_ADDRESS:?DASHBOARD_BIND_ADDRESS must be set}:${DASHBOARD_HTTPS_PORT:?DASHBOARD_HTTPS_PORT must be set}:${DASHBOARD_HTTPS_PORT:?DASHBOARD_HTTPS_PORT must be set}"
    volumes:
      - ./docker/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - nodriva_caddy_data:/data
      - nodriva_caddy_config:/config
    restart: unless-stopped

volumes:
  nodriva_db_data:
  nodriva_attachments:
  # Mounted read-only by Web even when the optional backup job is absent, so a
  # later backup overlay can expose its status without changing Web storage.
  nodriva_backups:
  nodriva_caddy_data:
  nodriva_caddy_config:
