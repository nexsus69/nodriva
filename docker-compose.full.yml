services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: dashboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - dashboard_full_db_data:/var/lib/postgresql/data
      - ./Specifiche/dashboard_v4_schema_corrected.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dashboard"]
      interval: 5s
      timeout: 5s
      retries: 20

  db-migrate:
    build:
      context: .
      dockerfile: docker/db-migrate/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      DASHBOARD_WEB_PASSWORD: ${DASHBOARD_WEB_PASSWORD:?DASHBOARD_WEB_PASSWORD must be set}
    volumes:
      - ./db/migrations:/schema/migrations:ro
    restart: "no"

  db-seed:
    build:
      context: .
      dockerfile: docker/db-seed/Dockerfile
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: dashboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-marco123@test.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD must be set}
    restart: "no"

  soketi:
    image: quay.io/soketi/soketi:1.6-16-alpine
    restart: unless-stopped
    environment:
      SOKETI_DEFAULT_APP_ID: ${PUSHER_APP_ID:-dashboard}
      SOKETI_DEFAULT_APP_KEY: ${NEXT_PUBLIC_PUSHER_KEY:?NEXT_PUBLIC_PUSHER_KEY must be set}
      SOKETI_DEFAULT_APP_SECRET: ${PUSHER_SECRET:?PUSHER_SECRET must be set}
      SOKETI_DEFAULT_APP_CLUSTER: ${NEXT_PUBLIC_PUSHER_CLUSTER:-mt1}
    expose:
      - "6001"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:6001/ready >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      args:
        NEXT_PUBLIC_PUSHER_KEY: ${NEXT_PUBLIC_PUSHER_KEY:?NEXT_PUBLIC_PUSHER_KEY must be set}
        NEXT_PUBLIC_PUSHER_CLUSTER: ${NEXT_PUBLIC_PUSHER_CLUSTER:-mt1}
        NEXT_PUBLIC_PUSHER_HOST: ${NEXT_PUBLIC_PUSHER_HOST:-localhost}
        NEXT_PUBLIC_PUSHER_PORT: ${NEXT_PUBLIC_PUSHER_PORT:-6001}
        NEXT_PUBLIC_PUSHER_SCHEME: ${NEXT_PUBLIC_PUSHER_SCHEME:-http}
        NEXT_PUBLIC_SESSION_IDLE_TIMEOUT_SECONDS: ${NEXT_PUBLIC_SESSION_IDLE_TIMEOUT_SECONDS:-1800}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      db-seed:
        condition: service_completed_successfully
      soketi:
        condition: service_healthy
      clamav:
        condition: service_healthy
    environment:
      HOSTNAME: 0.0.0.0
      DATABASE_ADAPTER: postgres
      DATABASE_URL: postgresql://dashboard_web:${DASHBOARD_WEB_PASSWORD:?DASHBOARD_WEB_PASSWORD must be set}@postgres:5432/dashboard
      REQUIRE_RESTRICTED_DB_ROLE: "true"
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3001}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET must be set}
      NEXT_PUBLIC_SESSION_IDLE_TIMEOUT_SECONDS: ${NEXT_PUBLIC_SESSION_IDLE_TIMEOUT_SECONDS:-1800}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-marco123@test.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD must be set}
      NEXT_PUBLIC_REALTIME_ENABLED: ${NEXT_PUBLIC_REALTIME_ENABLED:-true}
      REALTIME_WORKER_SECRET: ${REALTIME_WORKER_SECRET:?REALTIME_WORKER_SECRET must be set}
      NEXT_PUBLIC_PUSHER_KEY: ${NEXT_PUBLIC_PUSHER_KEY:?NEXT_PUBLIC_PUSHER_KEY must be set}
      NEXT_PUBLIC_PUSHER_CLUSTER: ${NEXT_PUBLIC_PUSHER_CLUSTER:-mt1}
      NEXT_PUBLIC_PUSHER_HOST: ${NEXT_PUBLIC_PUSHER_HOST:-localhost}
      NEXT_PUBLIC_PUSHER_PORT: ${NEXT_PUBLIC_PUSHER_PORT:-6001}
      NEXT_PUBLIC_PUSHER_SCHEME: ${NEXT_PUBLIC_PUSHER_SCHEME:-http}
      REALTIME_INTERNAL_HOST: ${REALTIME_INTERNAL_HOST:-soketi}
      REALTIME_INTERNAL_PORT: ${REALTIME_INTERNAL_PORT:-6001}
      REALTIME_INTERNAL_SCHEME: ${REALTIME_INTERNAL_SCHEME:-http}
      PUSHER_APP_ID: ${PUSHER_APP_ID:-dashboard}
      PUSHER_SECRET: ${PUSHER_SECRET:?PUSHER_SECRET must be set}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      ATTACHMENTS_REQUIRE_SCAN: "true"
      ATTACHMENTS_ROOT: /app/data/attachments
      ATTACHMENTS_REQUIRE_ENCRYPTION: "true"
      ATTACHMENTS_ENCRYPTION_KEY: ${ATTACHMENTS_ENCRYPTION_KEY:?ATTACHMENTS_ENCRYPTION_KEY must be set}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?FIELD_ENCRYPTION_KEY must be set}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?MFA_ENCRYPTION_KEY must be set}
      ACCOUNT_ACTION_PUBLIC_BASE_URL: ${ACCOUNT_ACTION_PUBLIC_BASE_URL:-http://localhost:3001}
    volumes:
      - dashboard_full_attachments:/app/data/attachments
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20

  realtime-worker:
    build:
      context: ./docker/realtime-worker
    depends_on:
      web:
        condition: service_healthy
    environment:
      REALTIME_DRAIN_URL: http://web:3000/api/internal/realtime/drain
      REALTIME_WORKER_SECRET: ${REALTIME_WORKER_SECRET:?REALTIME_WORKER_SECRET must be set}
      REALTIME_WORKER_INTERVAL_SECONDS: ${REALTIME_WORKER_INTERVAL_SECONDS:-5}
    restart: unless-stopped

  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    volumes:
      - dashboard_full_clamav_db:/var/lib/clamav
    expose:
      - "3310"
    mem_limit: 4g
    mem_reservation: 3g
    healthcheck:
      test: ["CMD-SHELL", "printf 'PING\\n' | nc -w 2 127.0.0.1 3310 | grep -q PONG"]
      interval: 30s
      timeout: 10s
      retries: 20

  prometheus:
    build:
      context: ./docker/prometheus
    depends_on:
      web:
        condition: service_healthy
    environment:
      REALTIME_WORKER_SECRET: ${REALTIME_WORKER_SECRET:?REALTIME_WORKER_SECRET must be set}
      REALTIME_METRICS_TARGET: web:3000
      PROMETHEUS_RETENTION_TIME: ${PROMETHEUS_RETENTION_TIME:-30d}
    volumes:
      - dashboard_full_prometheus:/prometheus
    ports:
      - "${DASHBOARD_BIND_ADDRESS:-127.0.0.1}:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 10

  backup:
    image: postgres:17
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    environment:
      BACKUP_DIRECT: "true"
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      PGDATABASE: dashboard
      POSTGRES_DATABASE: dashboard
      POSTGRES_USER: postgres
      BACKUP_ROOT: /backups/postgres
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - dashboard_full_backups:/backups
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/bash", "-lc"]
    command: ["while true; do /scripts/postgres-backup-maintenance.sh; sleep 86400; done"]
    restart: unless-stopped

  proxy:
    image: caddy:2.9-alpine
    depends_on:
      web:
        condition: service_healthy
      soketi:
        condition: service_healthy
    ports:
      - "${DASHBOARD_BIND_ADDRESS:-127.0.0.1}:3001:80"
      - "${DASHBOARD_BIND_ADDRESS:-127.0.0.1}:6001:6001"
    volumes:
      - ./docker/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - dashboard_full_caddy_data:/data
      - dashboard_full_caddy_config:/config
    restart: unless-stopped

volumes:
  dashboard_full_db_data:
  dashboard_full_attachments:
  dashboard_full_clamav_db:
  dashboard_full_prometheus:
  dashboard_full_backups:
  dashboard_full_caddy_data:
  dashboard_full_caddy_config:
