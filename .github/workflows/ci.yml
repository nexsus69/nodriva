name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_ADAPTER: sqlite
      SQLITE_DATABASE_PATH: ":memory:"
      NEXT_PUBLIC_REALTIME_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v1
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify source documentation
        run: pnpm docs:source

      - name: Verify Docker Compose profiles
        run: pnpm test:compose

      - name: Verify repository
        run: pnpm check

      - name: Verify SQLite snapshot, restore and maintenance
        run: node scripts/sqlite-backup-verify.test.mjs

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 14

  postgres-integration:
    name: PostgreSQL integration and adapter parity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: dashboard_ci_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: dashboard-ci-admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dashboard_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      INTEGRATION_DATABASE_ADMIN_URL: postgresql://postgres:dashboard-ci-admin@127.0.0.1:5432/dashboard_ci_test
      INTEGRATION_DATABASE_URL: postgresql://dashboard_ci_app:dashboard-ci-app@127.0.0.1:5432/dashboard_ci_test
      INTEGRATION_DATABASE_APP_PASSWORD: dashboard-ci-app
      DATABASE_URL: postgresql://dashboard_ci_app:dashboard-ci-app@127.0.0.1:5432/dashboard_ci_test
      DATABASE_ADAPTER: postgres
      REQUIRE_RESTRICTED_DB_ROLE: "true"
      NEXTAUTH_SECRET: dashboard-ci-nextauth-secret-at-least-32-characters
      NEXTAUTH_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_REALTIME_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v1
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Verify PostgreSQL empty schema, upgrade and migration reapply
        run: ./scripts/postgres-test-bootstrap.sh

      - name: Build Core
        run: pnpm --filter @dashboard/core build

      - name: Run PostgreSQL integration and parity tests
        run: pnpm test:postgres

      - name: Verify PostgreSQL backup and disposable restore
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          POSTGRES_DATABASE: dashboard_ci_test
          POSTGRES_USER: postgres
          BACKUP_ROOT: ${{ runner.temp }}/postgres-backup-test
        run: pnpm db:backup:verify

  e2e-parity:
    name: Browser ${{ matrix.profile }}
    strategy:
      fail-fast: false
      matrix:
        profile: [parity, realtime]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: dashboard_e2e_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: dashboard-e2e-admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dashboard_e2e_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      soketi:
        image: quay.io/soketi/soketi:1.6-16-alpine
        env:
          SOKETI_DEFAULT_APP_ID: dashboard-e2e
          SOKETI_DEFAULT_APP_KEY: dashboard-e2e-key
          SOKETI_DEFAULT_APP_SECRET: dashboard-e2e-secret
          SOKETI_PORT: "6001"
        ports:
          - 6001:6001
        options: >-
          --health-cmd "wget -q -O- http://127.0.0.1:6001/ready"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      INTEGRATION_DATABASE_ADMIN_URL: postgresql://postgres:dashboard-e2e-admin@127.0.0.1:5432/dashboard_e2e_test
      INTEGRATION_DATABASE_URL: postgresql://dashboard_ci_app:dashboard-ci-app@127.0.0.1:5432/dashboard_e2e_test
      INTEGRATION_DATABASE_APP_PASSWORD: dashboard-ci-app
      DATABASE_URL: postgresql://dashboard_ci_app:dashboard-ci-app@127.0.0.1:5432/dashboard_e2e_test
      DATABASE_ADAPTER: postgres
      REQUIRE_RESTRICTED_DB_ROLE: "true"
      NEXTAUTH_SECRET: dashboard-e2e-nextauth-secret-at-least-32-characters
      NEXTAUTH_URL: http://127.0.0.1:3102
      PARITY_POSTGRES_ADMIN_URL: postgresql://postgres:dashboard-e2e-admin@127.0.0.1:5432/dashboard_e2e_test
      PARITY_POSTGRES_APP_URL: postgresql://dashboard_ci_app:dashboard-ci-app@127.0.0.1:5432/dashboard_e2e_test
      PARITY_POSTGRES_TEMPLATE_DATABASE: dashboard_e2e_test
      NEXT_PUBLIC_REALTIME_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v1
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install PostgreSQL client and Chromium
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
          pnpm exec playwright install --with-deps chromium

      - name: Initialize isolated PostgreSQL schema and restricted role
        run: ./scripts/postgres-test-bootstrap.sh

      - name: Run SQLite/PostgreSQL browser parity
        if: matrix.profile == 'parity'
        run: pnpm e2e:parity

      - name: Verify realtime delivery between browser sessions
        if: matrix.profile == 'realtime'
        env:
          PUSHER_APP_ID: dashboard-e2e
          NEXT_PUBLIC_PUSHER_KEY: dashboard-e2e-key
          PUSHER_SECRET: dashboard-e2e-secret
          NEXT_PUBLIC_PUSHER_CLUSTER: mt1
          NEXT_PUBLIC_PUSHER_HOST: 127.0.0.1
          NEXT_PUBLIC_PUSHER_PORT: "6001"
          NEXT_PUBLIC_PUSHER_SCHEME: http
          REALTIME_INTERNAL_HOST: 127.0.0.1
          REALTIME_INTERNAL_PORT: "6001"
          REALTIME_INTERNAL_SCHEME: http
          REALTIME_WORKER_SECRET: dashboard-e2e-worker-secret
        run: pnpm e2e:realtime

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.profile }}-results
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 14
