services:
  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    volumes: [dashboard_full_clamav_db:/var/lib/clamav]
    expose: ["${CLAMAV_PORT:?CLAMAV_PORT must be set}"]
    mem_limit: 4g
    mem_reservation: 3g
    healthcheck:
      test: ["CMD-SHELL", "printf 'PING\\n' | nc -w 2 ${CONTAINER_LOOPBACK_HOST:?CONTAINER_LOOPBACK_HOST must be set} ${CLAMAV_PORT:?CLAMAV_PORT must be set} | grep -q PONG"]
      interval: 30s
      timeout: 10s
      retries: 20
  web:
    environment:
      CLAMAV_HOST: ${CLAMAV_HOST:?CLAMAV_HOST must be set}
      CLAMAV_PORT: ${CLAMAV_PORT:?CLAMAV_PORT must be set}

volumes:
  dashboard_full_clamav_db:
