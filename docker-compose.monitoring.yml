services:
  prometheus:
    build: { context: ./docker/prometheus }
    depends_on: { web: { condition: service_healthy } }
    environment:
      REALTIME_WORKER_SECRET: ${REALTIME_WORKER_SECRET:-}
      REALTIME_METRICS_TARGET: ${DASHBOARD_WEB_INTERNAL_HOST:?}:${DASHBOARD_WEB_PORT:?}
      PROMETHEUS_PORT: ${PROMETHEUS_PORT:?PROMETHEUS_PORT must be set}
    volumes: [nodriva_prometheus:/prometheus]
    ports: ["${DASHBOARD_METRICS_BIND_ADDRESS:?}:${PROMETHEUS_PORT:?}:${PROMETHEUS_PORT:?}"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://${CONTAINER_LOOPBACK_HOST:?CONTAINER_LOOPBACK_HOST must be set}:${PROMETHEUS_PORT:?PROMETHEUS_PORT must be set}/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  nodriva_prometheus:
