services:
  postgres:
    image: postgres:17
    container_name: dashboard-db-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: dashboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    command: ["postgres", "-p", "${DASHBOARD_POSTGRES_PORT:?DASHBOARD_POSTGRES_PORT must be set}"]
    ports:
      - "${DASHBOARD_DATABASE_BIND_ADDRESS:?DASHBOARD_DATABASE_BIND_ADDRESS must be set}:${DASHBOARD_DATABASE_HOST_PORT:?DASHBOARD_DATABASE_HOST_PORT must be set}:${DASHBOARD_POSTGRES_PORT:?DASHBOARD_POSTGRES_PORT must be set}"
    volumes:
      - dashboard_db_data:/var/lib/postgresql/data

  realtime-worker:
    profiles: ["realtime"]
    build:
      context: ./docker/realtime-worker
    restart: unless-stopped
    environment:
      REALTIME_DRAIN_URL: ${REALTIME_DRAIN_URL:?REALTIME_DRAIN_URL must be set}
      REALTIME_WORKER_SECRET: ${REALTIME_WORKER_SECRET:?REALTIME_WORKER_SECRET must be set}
      REALTIME_WORKER_INTERVAL_SECONDS: ${REALTIME_WORKER_INTERVAL_SECONDS:-5}
    extra_hosts:
      - "${DASHBOARD_HOST_GATEWAY_NAME:?DASHBOARD_HOST_GATEWAY_NAME must be set}:host-gateway"

  prometheus:
    profiles: ["monitoring"]
    build:
      context: ./docker/prometheus
    restart: unless-stopped
    environment:
      REALTIME_WORKER_SECRET: ${REALTIME_WORKER_SECRET:?REALTIME_WORKER_SECRET must be set}
      REALTIME_METRICS_TARGET: ${REALTIME_METRICS_TARGET:?REALTIME_METRICS_TARGET must be set}
    extra_hosts:
      - "${DASHBOARD_HOST_GATEWAY_NAME:?DASHBOARD_HOST_GATEWAY_NAME must be set}:host-gateway"
    ports:
      - "${DASHBOARD_METRICS_BIND_ADDRESS:?DASHBOARD_METRICS_BIND_ADDRESS must be set}:${PROMETHEUS_HOST_PORT:?PROMETHEUS_HOST_PORT must be set}:${PROMETHEUS_PORT:?PROMETHEUS_PORT must be set}"

  clamav:
    profiles: ["antivirus"]
    image: clamav/clamav:1.4
    container_name: dashboard-clamav
    restart: unless-stopped
    ports:
      - "${CLAMAV_BIND_ADDRESS:?CLAMAV_BIND_ADDRESS must be set}:${CLAMAV_HOST_PORT:?CLAMAV_HOST_PORT must be set}:${CLAMAV_PORT:?CLAMAV_PORT must be set}"
    volumes:
      - dashboard_clamav_db:/var/lib/clamav
    mem_limit: 4g
    mem_reservation: 3g

volumes:
  dashboard_db_data:
  dashboard_clamav_db:
