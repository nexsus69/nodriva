services:
  postgres:
    image: postgres:17
    container_name: dashboard-db-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: dashboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "5433:5432" # Mappato sulla 5433 per evitare conflitti con l'altro DB sulla 5432
    volumes:
      - dashboard_db_data:/var/lib/postgresql/data

volumes:
  dashboard_db_data:
