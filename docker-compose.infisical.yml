name: nodriva-infisical

# Optional reference integration. Nodriva does not require Infisical; operators
# may use another secret-management mechanism supported by their environment.

services:
  infisical-db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: infisical
      POSTGRES_USER: infisical
      POSTGRES_PASSWORD: ${INFISICAL_DB_PASSWORD:?INFISICAL_DB_PASSWORD must be set}
    command: ["postgres", "-p", "${INFISICAL_DATABASE_PORT:?INFISICAL_DATABASE_PORT must be set}"]
    volumes:
      - nodriva_infisical_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p ${INFISICAL_DATABASE_PORT:?INFISICAL_DATABASE_PORT must be set} -U infisical -d infisical"]
      interval: 5s
      timeout: 5s
      retries: 20

  infisical-redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--port", "${INFISICAL_REDIS_PORT:?INFISICAL_REDIS_PORT must be set}"]
    volumes:
      - nodriva_infisical_redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p ${INFISICAL_REDIS_PORT:?INFISICAL_REDIS_PORT must be set} ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  infisical:
    image: infisical/infisical:v0.162.14
    restart: unless-stopped
    depends_on:
      infisical-db:
        condition: service_healthy
      infisical-redis:
        condition: service_healthy
    environment:
      ENCRYPTION_KEY: ${INFISICAL_ENCRYPTION_KEY:?INFISICAL_ENCRYPTION_KEY must be set}
      AUTH_SECRET: ${INFISICAL_AUTH_SECRET:?INFISICAL_AUTH_SECRET must be set}
      DB_CONNECTION_URI: postgresql://infisical:${INFISICAL_DB_PASSWORD:?INFISICAL_DB_PASSWORD must be set}@${INFISICAL_DATABASE_HOST:?INFISICAL_DATABASE_HOST must be set}:${INFISICAL_DATABASE_PORT:?INFISICAL_DATABASE_PORT must be set}/infisical
      REDIS_URL: redis://${INFISICAL_REDIS_HOST:?INFISICAL_REDIS_HOST must be set}:${INFISICAL_REDIS_PORT:?INFISICAL_REDIS_PORT must be set}
      SITE_URL: ${INFISICAL_PUBLIC_URL:?INFISICAL_PUBLIC_URL must be set}
      PORT: ${INFISICAL_PORT:?INFISICAL_PORT must be set}
    ports:
      - "${INFISICAL_BIND_ADDRESS:?INFISICAL_BIND_ADDRESS must be set}:${INFISICAL_HOST_PORT:?INFISICAL_HOST_PORT must be set}:${INFISICAL_PORT:?INFISICAL_PORT must be set}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://${CONTAINER_LOOPBACK_HOST:?CONTAINER_LOOPBACK_HOST must be set}:${INFISICAL_PORT:?INFISICAL_PORT must be set}/api/status >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20

volumes:
  nodriva_infisical_db:
  nodriva_infisical_redis:
